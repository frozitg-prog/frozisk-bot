services:
  - type: web
    name: froziskbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: FroziSkbot
      - key: ADMIN_IDS
        value: "5077189331"
      - key: BOT_PROXY
        value: ""
      - key: CURRENCY
        value: "₽"